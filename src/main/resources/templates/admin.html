<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f6f7fb;
            padding:40px;
            color:#222;
        }

        .container{
            max-width:1100px;
            margin:0 auto;
        }

        .title{
            font-size:32px;
            font-weight:bold;
            margin-bottom:8px;
        }

        .subtitle{
            color:#666;
            margin-bottom:30px;
        }

        .card{
            background:white;
            border-radius:12px;
            padding:24px;
            box-shadow:
                    0 4px 16px
                    rgba(0,0,0,.08);
        }

        .cards{

            display:flex;

            gap:20px;

            margin-bottom:30px;

        }

        .card-box{

            background:#fff;

            padding:20px;

            border-radius:12px;

            width:180px;

            box-shadow:
                    0 4px 10px
                    rgba(0,0,0,.08);

        }

        .card-box h3{

            color:#666;

            margin:0 0 10px 0;

        }

        .card-box p{

            font-size:36px;

            font-weight:bold;

            margin:0;

        }

        .actions{

            display:flex;

            gap:12px;

            margin-bottom:24px;

        }

        .button{

            text-decoration:none;

            background:#222;

            color:white;

            padding:10px 14px;

            border-radius:8px;

            font-size:14px;

        }

        .button.secondary{

            background:#666;

        }

        .badge{

            display:inline-block;

            background:#ffe6e6;

            color:#d60000;

            padding:6px 12px;

            border-radius:999px;

            font-size:14px;

            margin-bottom:20px;

        }

        table{

            border-collapse:collapse;

            width:100%;

        }

        th{

            background:#f0f2f5;

            text-align:left;

            padding:14px;

        }

        td{

            border-top:1px solid #eee;

            padding:14px;

        }

        tr:hover{

            background:#fafafa;

        }

        .empty{

            text-align:center;

            padding:40px;

            color:#777;

        }

        .status{

            color:#d60000;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="title">

        실패 알림 대시보드

    </div>

    <div class="subtitle">

        최종 실패 상태의 알림을 운영자가 확인하기 위한 모니터링 화면입니다.

    </div>

    <div class="card">

        <div class="cards">

            <div class="card-box">

                <h3>FAILED</h3>

                <p th:text="${failedCount}">
                    0
                </p>

            </div>

            <div class="card-box">

                <h3>PROCESSING</h3>

                <p th:text="${processingCount}">
                    0
                </p>

            </div>

            <div class="card-box">

                <h3>REQUESTED</h3>

                <p th:text="${requestedCount}">
                    0
                </p>

            </div>

        </div>

        <div class="actions">

            <a
                    href="/admin/dashboard"
                    class="button">

                새로고침

            </a>

            <a
                    href="/notifications"
                    class="button secondary">

                전체 알림 JSON 보기

            </a>

        </div>

        <div class="badge">

            FAILED Notifications

        </div>

        <table>

            <tr>

                <th>ID</th>

                <th>Receiver</th>

                <th>Event</th>

                <th>Status</th>

                <th>Failure Reason</th>

            </tr>

            <tr
                    th:if=
                            "${#lists.isEmpty(notifications)}">

                <td
                        colspan="5"
                        class="empty">

                    현재 실패 알림이 없습니다.

                </td>

            </tr>

            <tr
                    th:each="n : ${notifications}">

                <td
                        th:text="${n.id}">
                </td>

                <td
                        th:text="${n.receiverId}">
                </td>

                <td
                        th:text="${n.eventId}">
                </td>

                <td
                        class="status"
                        th:text="${n.status}">
                </td>

                <td
                        th:text="${n.failureReason}">
                </td>

            </tr>

        </table>

    </div>

</div>

</body>
</html>
